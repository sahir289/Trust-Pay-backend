name: Deploying to EC2

on:
  push:
    branches:
      - trust-pay-stg

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
        TARGET_DIR: ${{ secrets.TARGET_DIR }}
      run: |
        # Write the SSH key to a file
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key

        # Test SSH connection first
        echo "Testing SSH connection..."
        ssh -o StrictHostKeyChecking=no -i private_key $USER@$HOST "whoami" || echo "SSH connection failed"

        # SSH into EC2 and deploy with detailed debug
        echo "Deploying to EC2..."
        ssh -o StrictHostKeyChecking=no -i private_key $USER@$HOST << 'EOF'
          echo "User: $(whoami)"
          echo "Target directory: $TARGET_DIR"
          cd $TARGET_DIR || { echo "Failed to cd into $TARGET_DIR"; exit 1; }
          echo "Current directory: $(/bin/pwd)"
          git fetch origin
          echo "Git remote: $(git remote -v)"
          echo "Git status: $(git status)"
          git pull origin trust-pay-stg --verbose || echo "Git pull failed"
          echo "Latest commit: $(git log -1 --oneline)"
          npm install || echo "npm install failed"
          pm2 restart all || echo "pm2 restart failed"
        EOF

        # Clean up
        rm -f private_key