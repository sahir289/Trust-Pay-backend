name: Deploying to EC2

on:
  push:
    branches:
      - trust-pay-stg

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Debug Secrets
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
        TARGET_DIR: /home/ubuntu/trust-pay/Trust-Pay-backend
      run: |
        echo "PRIVATE_KEY is set: $([ -n "$PRIVATE_KEY" ] && echo 'yes' || echo 'no')"
        echo "HOST is set: $([ -n "$HOST" ] && echo 'yes' || echo 'no')"
        echo "USER is set: $([ -n "$USER" ] && echo 'yes' || echo 'no')"
        echo "TARGET_DIR is set: $([ -n "$TARGET_DIR" ] && echo 'yes' || echo 'no')"
        if [ -z "$TARGET_DIR" ]; then echo "TARGET_DIR is empty or not usable!"; exit 1; fi
        echo "Testing TARGET_DIR length: ${#TARGET_DIR}"

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
        TARGET_DIR: /home/ubuntu/trust-pay/Trust-Pay-backend
      run: |
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        echo "Deploy secrets check:"
        echo "TARGET_DIR length in deploy step: ${#TARGET_DIR}"
        if [ -z "$TARGET_DIR" ]; then echo "TARGET_DIR is empty in deploy step!"; exit 1; fi
        echo "Testing SSH connection..."
        ssh -o StrictHostKeyChecking=no -i private_key $USER@$HOST "whoami" || { echo "SSH connection failed"; exit 1; }
        echo "Deploying to EC2..."
        ssh -o StrictHostKeyChecking=no -i private_key $USER@$HOST << 'EOF'
          echo "User: $(whoami)"
          echo "Target directory length: ${#TARGET_DIR}"
          if [ -z "$TARGET_DIR" ]; then echo "TARGET_DIR is empty inside SSH!"; exit 1; fi
          cd "$TARGET_DIR" || { echo "Failed to cd into $TARGET_DIR"; exit 1; }
          echo "Current directory: $(/bin/pwd)"
          git fetch origin
          echo "Git remote: $(git remote -v)"
          echo "Git status: $(git status)"
          git pull origin trust-pay-stg --verbose || { echo "Git pull failed"; exit 1; }
          echo "Latest commit: $(git log -1 --oneline)"
          npm install || { echo "npm install failed"; exit 1; }
          pm2 restart trust-pay || { echo "pm2 restart failed - check process name"; pm2 list; exit 1; }
        EOF
        rm -f private_key