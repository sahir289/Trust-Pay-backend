name: Deploying to EC2

on:
  push:
    branches:
      - trust-pay-stg

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Debug Secrets
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
        TARGET_DIR: ${{ secrets.TARGET_DIR }}
      run: |
        echo "PRIVATE_KEY is set: $([ -n "$PRIVATE_KEY" ] && echo 'yes' || echo 'no')"
        echo "HOST: $HOST"
        echo "USER: $USER"
        echo "TARGET_DIR: $TARGET_DIR"
        if [ -z "$TARGET_DIR" ]; then echo "TARGET_DIR is not set or empty!"; exit 1; fi

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
        TARGET_DIR: ${{ secrets.TARGET_DIR }}
      run: |
        echo "$PRIVATE_KEY" > private_key
        chmod 600 private_key
        echo "Testing SSH connection..."
        ssh -o StrictHostKeyChecking=no -i private_key $USER@$HOST "whoami" || { echo "SSH connection failed"; exit 1; }
        echo "Deploying to EC2..."
        ssh -o StrictHostKeyChecking=no -i private_key $USER@$HOST << 'EOF'
          echo "User: $(whoami)"
          echo "Target directory from secret: $TARGET_DIR"
          if [ -z "$TARGET_DIR" ]; then echo "TARGET_DIR is empty!"; exit 1; fi
          cd "$TARGET_DIR" || { echo "Failed to cd into $TARGET_DIR"; exit 1; }
          echo "Current directory: $(/bin/pwd)"
          git fetch origin
          echo "Git remote: $(git remote -v)"
          echo "Git status: $(git status)"
          git pull origin trust-pay-stg --verbose || { echo "Git pull failed"; exit 1; }
          echo "Latest commit: $(git log -1 --oneline)"
          npm install || { echo "npm install failed"; exit 1; }
          pm2 restart trust-pay || { echo "pm2 restart failed - check process name"; pm2 list; exit 1; }
        EOF
        rm -f private_key